<!doctype html>
<!-- AirTalk 디자인 견본 — tokens.css 만으로 만든 화면(프레임워크 없음). 다른 앱에서 시작점으로 복사해 쓴다. -->
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AirTalk 디자인 견본</title>
<link rel="stylesheet" href="./tokens.css" />
<style>
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 140px; }
  header { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 20px; }
  .who { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 4px; border-radius: 999px; font-weight: 700; font-size: 13.5px; }
  .who:hover { background: var(--at-hover); }
  .avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--at-brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 8px 0 16px; }
  .search { flex: 1; height: 40px; border: 1px solid var(--at-divider); border-radius: var(--at-r-control); padding: 0 14px; font: inherit; background: var(--at-paper); color: var(--at-text); }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; }
  .list-row:hover { background: var(--at-hover); }
  .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--at-fill); }
  .ico.brand { background: var(--at-brand-soft); color: var(--at-brand); }
  .t { font-size: 15px; font-weight: 700; } .s { font-size: 12.5px; color: var(--at-text-2); margin-top: 2px; }
  h2 { font-size: 13px; color: var(--at-text-2); font-weight: 700; margin: 28px 6px 8px; letter-spacing: 0; }
  .settings { background: var(--at-settings-bg); padding: 16px; border-radius: 24px; }
  .row-val { margin-left: auto; font-size: 14.5px; font-weight: 500; color: var(--at-text-2); }
  .dock { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 16px; }
  .chev { width: 22px; height: 40px; border: 0; background: transparent; color: var(--at-text-2); border-radius: 8px; cursor: pointer; }
  .chev:hover { background: var(--at-hover); }
  .lang { height: 40px; padding: 0 10px; border: 0; background: transparent; border-radius: 10px; text-align: left; cursor: pointer; color: var(--at-text); font: inherit; }
  .lang:hover { background: var(--at-hover); }
  .lang small { display: block; font-size: 10.5px; font-weight: 600; color: var(--at-text-2); }
  .lang b { font-size: 13.5px; }
  .card-line { font-size: 22px; font-weight: 500; line-height: 1.45; margin: 0; }
  .card-src { font-size: 14.5px; color: var(--at-text-2); margin: 4px 0 0; }
  .menu-demo { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; }
  .radio { width: 16px; height: 16px; border-radius: 999px; border: 2px solid var(--at-text-3); display: grid; place-items: center; margin-left: auto; }
  .radio.on { border-color: var(--at-brand); } .radio.on::after { content: ''; width: 6px; height: 6px; border-radius: 999px; background: var(--at-brand); }
  .sub { font-size: 12px; color: var(--at-text-2); font-weight: 400; display: block; }
</style>
</head>
<body>
<header>
  <span class="at-logo" style="font-size:24px">airtalk<b>.</b></span>
  <span class="who"><span class="avatar">관</span>관리자 ⌄</span>
</header>
<main class="wrap">
  <div class="toolbar">
    <input class="search" placeholder="대화 검색 (제목·내용)" />
    <button class="at-btn" style="background:transparent;color:var(--at-text-2)">선택</button>
    <button class="at-btn at-btn--primary">＋ 새 세션</button>
  </div>
  <div class="list-row"><span class="ico">→</span><div><div class="t">AI BIM 센터 보고</div><div class="s">15:39 · 실시간 번역</div></div></div>
  <div class="list-row"><span class="ico brand">⇄</span><div><div class="t">김포공항 견학 통역</div><div class="s">15:39 · 양방향 통역</div></div></div>

  <h2>번역 카드</h2>
  <p class="card-line">今天的报告是关于AI BIM中心的运营方案。</p>
  <p class="card-src">오늘 보고는 AI BIM 센터 운영 방안입니다.</p>

  <h2>설정 묶음(폰)</h2>
  <div class="settings">
    <div class="at-group">
      <div class="at-row">시스템 언어<span class="row-val">한국어 ›</span></div>
      <div class="at-row">테마<span class="row-val">라이트 ›</span></div>
    </div>
  </div>

  <h2>작은 메뉴(⌄) + 옆 목록</h2>
  <div class="menu-demo">
    <div class="at-menu" style="width:280px">
      <div class="at-menu-row" style="flex-direction:column;align-items:flex-start;gap:0">입력 소스<span class="sub">마이크</span></div>
      <div class="at-menu-row" style="flex-direction:column;align-items:flex-start;gap:0">입력 장치<span class="sub">기본 마이크</span></div>
    </div>
    <div class="at-menu" style="width:220px">
      <div class="at-menu-row">마이크<span class="radio on"></span></div>
      <div class="at-menu-row">시스템 오디오<span class="radio"></span></div>
    </div>
  </div>

  <h2>버튼</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="at-btn">취소</button><button class="at-btn at-btn--primary">만들기</button>
    <button class="at-btn at-btn--danger">삭제</button><button class="at-icon-btn" aria-pressed="true">🔈</button>
    <button class="at-btn" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">다크/라이트 전환</button>
  </div>
</main>
<div class="dock">
  <span class="at-bar-group"><button class="at-icon-btn" aria-label="음소거">🎤</button><button class="chev">⌄</button><button class="at-icon-btn" aria-label="TTS">≋</button><button class="chev">⌄</button></span>
  <span class="at-bar-group"><button class="lang"><small>입력 언어</small><b>자동 감지 ⌄</b></button><span style="color:var(--at-text-2)">→</span><button class="lang"><small>출력 언어</small><b>한국어 ⌄</b></button></span>
  <span class="at-bar-group"><button class="at-icon-btn" aria-label="더 보기">⋯</button></span>
  <button class="at-btn at-btn--primary" style="height:48px;border-radius:14px;box-shadow:var(--at-shadow-brand)">▶ 시작</button>
</div>
</body>
</html>
